# Pushing a tag like v1.0.0: build every platform's package on that platform, test and
# verify it there, then publish all of them to the VS Code Marketplace and Open VSX and
# attach them to a GitHub release.
#
# Needs two repository secrets, created by the publisher:
#   VSCE_PAT  an Azure DevOps token with Marketplace > Manage scope, for publisher codewrapper12
#   OVSX_PAT  an Open VSX access token, for namespace codewrapper12
# Without them the packages are still built, tested and attached to the GitHub release.
name: Release

on:
  push:
    tags: ["v*"]
  # A dry run from the Actions tab: every platform's package built, tested and verified,
  # and nothing released or published.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      # Every platform runs to the end, so one failure never hides another. Publishing
      # still waits for all six.
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win32-x64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: ubuntu-latest, target: linux-x64 }
          # GitHub's own ARM machines, so each ARM package is tested and verified on the
          # kind of machine it is for, as the others are.
          - { os: windows-11-arm, target: win32-arm64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The engine tests build C++ solutions with the compiler a student on each system
      # would have: Apple's clang, Ubuntu's g++, and on Windows MSYS2's MinGW-w64 — the one
      # the visualizer's own advice tells Windows students to install.
      - name: C++ compiler (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ runner.arch == 'ARM64' && 'CLANGARM64' || 'UCRT64' }}
          install: ${{ runner.arch == 'ARM64' && 'mingw-w64-clang-aarch64-clang' || 'mingw-w64-ucrt-x86_64-gcc' }}
          path-type: inherit
          update: false
      - name: Use the MinGW-w64 compiler
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bin="${{ steps.msys2.outputs.msys2-location }}/${{ runner.arch == 'ARM64' && 'clangarm64' || 'ucrt64' }}/bin"
          compiler="$bin/${{ runner.arch == 'ARM64' && 'clang++' || 'g++' }}.exe"
          echo "$bin" >> "$GITHUB_PATH"
          echo "DSAVIZ_CXX=$compiler" >> "$GITHUB_ENV"
      - name: Show the C++ compiler
        shell: bash
        run: ${DSAVIZ_CXX:-$(command -v clang++ || command -v g++)} --version

      - name: The tag matches the version being released
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./extension/package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $version"; exit 1; }

      - name: Engine tests
        run: dotnet test engine/DsaViz.sln

      - name: Extension tests
        working-directory: extension
        run: |
          npm ci
          npm test

      - name: Package
        working-directory: extension
        run: npm run package -- ${{ matrix.target }}

      # The package as a student gets it: unpacked, its engine run with .NET removed from
      # the environment — on the platform it is for.
      - name: Verify the package
        working-directory: extension
        shell: bash
        run: npm run verify-package -- dist/dsa-playback-${{ matrix.target }}.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: dsa-playback-${{ matrix.target }}
          path: extension/dist/dsa-playback-${{ matrix.target }}.vsix
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - working-directory: extension
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Attach the packages to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/*.vsix --title "DSA Playback $GITHUB_REF_NAME" --notes-file extension/CHANGELOG.md

      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: extension
        run: for file in ../packages/*.vsix; do npx vsce publish --packagePath "$file"; done

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: extension
        run: for file in ../packages/*.vsix; do npx ovsx publish "$file" -p "$OVSX_PAT"; done

      - name: Say what was skipped
        if: env.VSCE_PAT == '' || env.OVSX_PAT == ''
        run: echo "::warning::VSCE_PAT or OVSX_PAT is not set, so publishing to that store was skipped. The packages are on the GitHub release."
