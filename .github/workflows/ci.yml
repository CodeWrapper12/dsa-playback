# Every push and pull request: build and test everything on Windows, macOS and Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      # The engine tests run Python solutions: oldest and newest supported, side by side.
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.9
            3.13

      - name: Engine tests
        run: dotnet test engine/DsaViz.sln

      - name: Extension tests
        working-directory: extension
        run: |
          npm ci
          npm test

      - name: Integration tests in VS Code (Linux)
        if: runner.os == 'Linux'
        working-directory: extension
        run: xvfb-run -a npm run test:integration

      - name: Integration tests in VS Code
        if: runner.os != 'Linux'
        working-directory: extension
        run: npm run test:integration
