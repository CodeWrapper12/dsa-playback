# Every push and pull request: build and test everything on Windows, macOS and Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand from the Actions tab, on any branch.
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      # The engine tests run Python solutions: oldest and newest supported, side by side.
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.9
            3.13

      # The engine tests build C++ solutions with the compiler a student on each system
      # would have: Apple's clang, Ubuntu's g++, and on Windows MSYS2's MinGW-w64 — the one
      # the visualizer's own advice tells Windows students to install.
      - name: C++ compiler (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ runner.arch == 'ARM64' && 'CLANGARM64' || 'UCRT64' }}
          install: ${{ runner.arch == 'ARM64' && 'mingw-w64-clang-aarch64-clang' || 'mingw-w64-ucrt-x86_64-gcc' }}
          path-type: inherit
          update: false
      - name: Use the MinGW-w64 compiler
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bin="${{ steps.msys2.outputs.msys2-location }}/${{ runner.arch == 'ARM64' && 'clangarm64' || 'ucrt64' }}/bin"
          compiler="$bin/${{ runner.arch == 'ARM64' && 'clang++' || 'g++' }}.exe"
          echo "$bin" >> "$GITHUB_PATH"
          echo "DSAVIZ_CXX=$compiler" >> "$GITHUB_ENV"
      # The engine tests build Java solutions with a JDK, as students install one.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The engine tests build Rust solutions with rustup's stable toolchain, as students install it.
      - uses: dtolnay/rust-toolchain@stable
      - name: Show the Rust compiler
        shell: bash
        run: rustc --version --verbose

      - name: Show the C++ compiler
        shell: bash
        run: ${DSAVIZ_CXX:-$(command -v clang++ || command -v g++)} --version

      - name: Engine tests
        run: dotnet test engine/DsaViz.sln

      - name: Extension tests
        working-directory: extension
        run: |
          npm ci
          npm test

      - name: Integration tests in VS Code (Linux)
        if: runner.os == 'Linux'
        working-directory: extension
        run: xvfb-run -a npm run test:integration

      - name: Integration tests in VS Code
        if: runner.os != 'Linux'
        working-directory: extension
        run: npm run test:integration
